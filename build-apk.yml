name: APK oluştur

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub sunucusunda Android SDK hazır kurulu gelir; yalnızca gereken paketleri ekliyoruz.
      - name: Android SDK paketlerini hazırla
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"; fi
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK derle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK dosyasını adlandır
        run: cp app/build/outputs/apk/release/app-release.apk NaturaMathematica.apk

      - name: APK'yı çalışma sonucuna ekle (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: NaturaMathematica-APK
          path: |
            NaturaMathematica.apk
            tanitim-gorselleri/*.png

      - name: APK'yı ve görselleri Sürümler (Releases) sayfasına yükle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" NaturaMathematica.apk tanitim-gorselleri/*.png \
            --title "Natura Mathematica $TAG" \
            --notes "Natura Mathematica – Android telefon ve tablet için APK (Türkçe / English). Tanıtım görselleri de ektedir."
