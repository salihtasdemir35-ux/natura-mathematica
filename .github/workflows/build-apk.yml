name: APK oluştur

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK derle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK dosyasını adlandır
        run: cp app/build/outputs/apk/release/app-release.apk NaturaMathematica.apk

      - name: APK'yı çalışma sonucuna ekle (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: NaturaMathematica-APK
          path: NaturaMathematica.apk

      - name: APK'yı Sürümler (Releases) sayfasına yükle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" NaturaMathematica.apk \
            --title "Natura Mathematica $TAG" \
            --notes "Natura Mathematica – Android telefon ve tablet için APK (Türkçe / English)."
